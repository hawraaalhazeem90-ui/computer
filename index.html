<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقدير العلم والعالمات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FA;--surface:#FFFFFF;--ink:#1E1B3A;--muted:#5E5B7A;--line:#D6D2EA;--accent:#3B2F8F;--accent-ink:#FFFFFF;--gold:#E0A526;--ok:#12805C;--okbg:#DDF3EA;--bad:#B3261E;--badbg:#FBE3E1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13112A;--surface:#1D1A3B;--ink:#F0EEFC;--muted:#A9A5CC;--line:#37326A;--accent:#9C90FF;--accent-ink:#13112A;--ok:#5FD6A6;--okbg:#12382C;--bad:#FF8F88;--badbg:#431B19}}
:root[data-theme="dark"]{--bg:#13112A;--surface:#1D1A3B;--ink:#F0EEFC;--muted:#A9A5CC;--line:#37326A;--accent:#9C90FF;--accent-ink:#13112A;--ok:#5FD6A6;--okbg:#12382C;--bad:#FF8F88;--badbg:#431B19}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:26px 16px 50px}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;line-height:1.2;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 24px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.info{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.q{font-size:1.3rem;font-weight:700;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:right;padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border-right:5px solid var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font-size:3rem;font-weight:800;margin:4px 0}
.hide{display:none}
.logo{display:block;margin:0 auto 18px;background:#fff;border-radius:14px;padding:8px;max-width:min(300px,80%);height:auto}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.foot img{display:block;margin:0 auto 10px;background:#fff;border-radius:10px;padding:6px;width:110px;height:auto}
.foot p{margin:0;font-weight:700;color:var(--muted)}
</style>
</head>

<script>
var Q=[
{q:"ما أول كلمة نزلت من القرآن الكريم؟",o:["اقرأ","اكتب","تعلّم","اعلم"],a:0,e:"أول ما نزل من سورة العلق: «اقرأ باسم ربك الذي خلق»، وفي هذا إشارة إلى أن بداية الرسالة كانت بالقراءة والعلم."},
{q:"أكمل قوله تعالى: «قل هل يستوي الذين يعلمون و…»",o:["الذين لا يعلمون","الذين لا يعملون","الذين يجهلون الحق","الذين يتأخرون"],a:0,e:"من الآية 9 من سورة الزمر، وهي تبيّن أن أهل العلم لا يتساوون مع غيرهم."},
{q:"أكمل قوله تعالى: «إنما يخشى الله من عباده …»",o:["الصالحون","العلماء","المؤمنون","الأتقياء"],a:1,e:"من الآية 28 من سورة فاطر. فكلما ازداد الإنسان علمًا بعظمة الله ازداد خشية له."},
{q:"أكمل الحديث الشريف: «العلماء ورثة …»",o:["الملوك","الصالحين","الأنبياء","الحكماء"],a:2,e:"رواه أبو داود والترمذي، ومعناه أن العلماء يحملون ميراث الأنبياء من العلم والهداية."},
{q:"ما الدعاء الذي أُمر النبي ﷺ أن يقوله في طلب العلم؟ «وقل ربّ زدني …»",o:["رزقًا","علمًا","قوة","صبرًا"],a:1,e:"من الآية 114 من سورة طه، وفيها أن العلم نعمة يُطلب المزيد منها."},
{q:"أي عالم مسلم يُنسب إليه تأسيس علم الجبر؟",o:["ابن سينا","ابن الهيثم","الخوارزمي","الزهراوي"],a:2,e:"محمد بن موسى الخوارزمي ألّف كتاب «الجبر والمقابلة»، ومن اسمه جاءت كلمة «الخوارزمية» (Algorithm)."},
{q:"من مؤلف كتاب «القانون في الطب»؟",o:["ابن سينا","الرازي","ابن النفيس","الخوارزمي"],a:0,e:"ابن سينا ألّفه، وظل مرجعًا مهمًا في الطب قرونًا في الشرق والغرب."},
{q:"أي عالم اشتهر بكتاب «المناظر» في علم البصريات؟",o:["البيروني","ابن الهيثم","جابر بن حيان","ابن رشد"],a:1,e:"ابن الهيثم أرسى منهج التجربة في دراسة الضوء والإبصار، ويُعدّ من رواد البصريات."},
{q:"من حديث مسلم: «من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى …»",o:["الرزق","الجنة","النجاح","الراحة"],a:1,e:"فيه بشارة عظيمة لطالب العلم بأن الله ييسّر له طريقًا إلى الجنة."}
];
var i=0,score=0,order=[],$=function(x){return document.getElementById(x)};
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function show(id){["start","quiz","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function load(){
 var d=Q[i];order=shuf(d.o.map(function(t,n){return{t:t,c:n===d.a}}));
 $("num").textContent="السؤال "+(i+1)+" من "+Q.length;
 $("pts").textContent="النقاط: "+score;
 $("bar").style.width=(i/Q.length*100)+"%";
 $("q").textContent=d.q;
 $("why").classList.add("hide");$("next").classList.add("hide");
 var box=$("opts");box.innerHTML="";
 order.forEach(function(o,n){
  var b=document.createElement("button");b.className="opt";b.textContent=o.t;
  b.onclick=function(){pick(n)};box.appendChild(b);
 });
}
function pick(n){
 var bs=$("opts").children,right=order[n].c;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(order[k].c)bs[k].classList.add("ok")}
 if(right){score++}else{bs[n].classList.add("bad")}
 $("pts").textContent="النقاط: "+score;
 $("why").textContent=(right?"أحسنت! ":"الإجابة الصحيحة موضحة بالأخضر. ")+Q[i].e;
 $("why").classList.remove("hide");
 $("next").textContent=(i===Q.length-1)?"عرض النتيجة":"السؤال التالي";
 $("next").classList.remove("hide");$("next").focus();
}
function finish(){
 $("bar").style.width="100%";
 $("final").textContent=score+" / "+Q.length;
 var r=score/Q.length;
 $("msg").textContent=r===1?"ممتاز! إجابات كاملة، بارك الله في علمك.":r>=0.7?"رائع! معلوماتك قوية، وبقي القليل لتبلغ الكمال.":r>=0.4?"جيد! راجع الشروحات وأعد المحاولة لتتحسن نتيجتك.":"بداية طيبة. طلب العلم رحلة، فأعد المحاولة وستتقدم.";
 $("copied").textContent="";show("end");
}
$("go").onclick=function(){i=0;score=0;show("quiz");load()};
$("next").onclick=function(){i++;if(i<Q.length){load()}else{finish()}};
$("again").onclick=function(){i=0;score=0;show("quiz");load()};
$("copy").onclick=function(){
 var t="حصلت على "+score+" من "+Q.length+" في مسابقة تقدير العلم والعالمات. هل تستطيع التفوق عليّ؟";
 try{navigator.clipboard.writeText(t).then(function(){$("copied").textContent="تم نسخ النتيجة."},function(){$("copied").textContent=t})}catch(e){$("copied").textContent=t}
};
</script>
